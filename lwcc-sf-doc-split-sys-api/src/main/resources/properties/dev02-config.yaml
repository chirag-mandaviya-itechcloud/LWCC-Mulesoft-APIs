# ============================================
# DEV02 Environment Configuration
# Salesforce PDF Document Split System API
# ============================================

# HTTP Listener Configuration
http:
  port: "8081"

# Environment identifier
mule.env: "dev02"

# API Configuration
api:
  id: "20701177"
  basePath: "/sys/sf-doc-split/v1"
  version: "1.0.0"
  name: "SF Document Split System API"

# Salesforce JWT Configuration
sfdc:
  alias: "muledev022025"
  endpoint: "https://test.salesforce.com/services/oauth2/token"
  tokenendpoint: "https://lwcc1--dev02.sandbox.my.salesforce.com/services/oauth2/token"
  audience: "https://test.salesforce.com"
  principal: "sfanypointapi@lwcc.com.dev02"
  instanceUrl: "https://lwcc1--dev02.sandbox.my.salesforce.com"
  instance:
    host: "lwcc1--dev02.sandbox.my.salesforce.com"
  upload:
    enabled: "false"

# Object Store Configuration
objectstore:
  idempotency:
    maxEntries: "10000"
    ttlMs: "86400000"
  jobs:
    maxEntries: "5000"
    ttlMs: "604800000"

# Job Worker Configuration
job:
  worker:
    maxConcurrency: "4"
    consumers: "2"
  cleanup:
    frequency: "24"
